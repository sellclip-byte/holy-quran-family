<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>الأطفال</title>
  <link rel="stylesheet" href="styles.css" />
<style>
body{background:#2d180d}
.kids-shell{background:linear-gradient(180deg,#b99858,#806236)!important;border:4px solid #e3c775!important;border-radius:24px!important;padding:14px!important;box-shadow:inset 0 0 0 2px #5c431f,0 8px 24px #0008!important}
.kids-title{margin:0 0 12px;text-align:center;color:#2f1c08;font-size:1.08rem;font-weight:900}
.kids-grid{display:grid;gap:12px}
.kids-choice{appearance:none;-webkit-appearance:none;width:100%;box-sizing:border-box;display:grid!important;place-items:center;min-height:88px;border:3px solid #d8b55e!important;border-radius:18px!important;background:#45351d!important;color:#ffe7a3!important;text-decoration:none!important;text-align:center;box-shadow:0 4px 10px #0003;font-family:inherit;cursor:pointer}
.kids-choice b{display:block;font-size:1.35rem;color:#ffe7a3!important}.kids-choice small{display:block;margin-top:5px;color:#fff0b9!important;font-size:.95rem}
#quizBox .item{background:#fffdf4;border:3px solid #d8b55e;border-radius:18px;padding:14px;color:#2f1c08;font-weight:800}
.reader-note{margin:14px 0 0;text-align:center;color:#fff!important;font-weight:900;font-size:1.25rem;line-height:1.7}
@media(max-width:600px){.kids-shell{padding:10px!important}.kids-choice{min-height:82px}.kids-choice b{font-size:1.25rem}}
.kids-blessing{margin:18px auto 0;max-width:430px;border:3px solid #d8b55e;border-radius:18px;overflow:hidden;background:#45351d;box-shadow:0 6px 16px #0006}.kids-blessing img{display:block;width:100%;height:auto;object-fit:cover}</style></head>
<body>
  <main class="app reader">
    <header class="reader-head">
      <a class="back" href="index.html" aria-label="العودة">←</a>
      <div>
        <h1>قسم الأطفال</h1>
        <p>Quran for Kids</p>
      </div>
    </header>

    <section class="reader-card kids-shell">
      <p class="kids-title">اختر ما تريد · Choose an Activity</p>
      <div class="kids-grid">
        <a class="kids-choice" href="quran.html"><span><b>قراءة مبسطة</b><small>Simple Reading</small></span></a>
        <button id="quiz" class="kids-choice" type="button"><span><b>اختبار قصير</b><small>Short Quiz</small></span></button>
      </div>
      <div id="quizBox" style="margin-top:12px"></div>
      <p class="reader-note">محتوى تعليمي مبسط للأطفال</p>
    </section><div class="kids-blessing"><img src="assets/kids-blessing.png" alt="دعاء البركة" loading="eager"></div>
  </main>

  <script>
    const questions = [
      {q:"كم عدد سور القرآن الكريم؟", a:"114"},
      {q:"ما أول سورة في القرآن؟", a:"الفاتحة"},
      {q:"ما آخر سورة في القرآن؟", a:"الناس"},
      {q:"ما أطول سورة في القرآن؟", a:"البقرة"},
      {q:"ما أقصر سورة في القرآن؟", a:"الكوثر"},
      {q:"ما السورة التي تسمى أم الكتاب؟", a:"الفاتحة"},
      {q:"ما السورة التي تبدأ بـ الحمد لله رب العالمين؟", a:"الفاتحة"},
      {q:"ما السورة التي فيها آية الكرسي؟", a:"البقرة"},
      {q:"ما رقم سورة الفاتحة؟", a:"1"},
      {q:"ما رقم سورة البقرة؟", a:"2"},
      {q:"كم عدد أركان الإسلام؟", a:"5"},
      {q:"كم عدد الصلوات المفروضة في اليوم؟", a:"5"},
      {q:"ما أول صلاة في اليوم؟", a:"الفجر"},
      {q:"كم ركعة في صلاة الفجر؟", a:"2"},
      {q:"كم ركعة في صلاة الظهر؟", a:"4"},
      {q:"كم ركعة في صلاة العصر؟", a:"4"},
      {q:"كم ركعة في صلاة المغرب؟", a:"3"},
      {q:"كم ركعة في صلاة العشاء؟", a:"4"},
      {q:"إلى أي جهة يتجه المسلم في الصلاة؟", a:"القبلة"},
      {q:"ما اسم بيت الله الحرام؟", a:"الكعبة"},
      {q:"في أي مدينة تقع الكعبة؟", a:"مكة"},
      {q:"ما الشهر الذي يصوم فيه المسلمون؟", a:"رمضان"},
      {q:"ما اسم ليلة عظيمة في رمضان؟", a:"ليلة القدر"},
      {q:"ما العبادة التي نؤديها خمس مرات يوميًا؟", a:"الصلاة"},
      {q:"ماذا نقول قبل الأكل؟", a:"بسم الله"},
      {q:"ماذا نقول بعد الأكل؟", a:"الحمد لله"},
      {q:"ماذا نقول عند العطاس؟", a:"الحمد لله"},
      {q:"بماذا يبدأ الوضوء؟", a:"النية"},
      {q:"ما العضو الذي نغسله بعد الوجه في الوضوء؟", a:"اليدين"},
      {q:"ما اسم النداء للصلاة؟", a:"الأذان"},
      {q:"من نعبد؟", a:"الله"},
      {q:"ما كتاب المسلمين؟", a:"القرآن"},
      {q:"من نبي الإسلام؟", a:"محمد"},
      {q:"ما لغة القرآن؟", a:"العربية"},
      {q:"ما أول كلمة نزلت من القرآن؟", a:"اقرأ"},
      {q:"ما اسم السورة التي تحمل اسم النحل؟", a:"النحل"},
      {q:"ما اسم السورة التي تحمل اسم النمل؟", a:"النمل"},
      {q:"ما اسم السورة التي تحمل اسم الفيل؟", a:"الفيل"},
      {q:"ما اسم السورة التي تحمل اسم الناس؟", a:"الناس"},
      {q:"ما السورة التي تبدأ بـ قل هو الله أحد؟", a:"الإخلاص"},
      {q:"ما السورة التي تبدأ بـ قل أعوذ برب الفلق؟", a:"الفلق"},
      {q:"ما السورة التي تبدأ بـ قل أعوذ برب الناس؟", a:"الناس"},
      {q:"ما السورة التي نقرأها في كل ركعة؟", a:"الفاتحة"},
      {q:"ما اسم ماء البئر المبارك في مكة؟", a:"زمزم"},
      {q:"ما اسم المسجد الموجود في مكة؟", a:"المسجد الحرام"},
      {q:"ما اسم المسجد الموجود في المدينة؟", a:"المسجد النبوي"},
      {q:"ما اليوم الذي يجتمع فيه المسلمون لصلاة الجمعة؟", a:"الجمعة"},
      {q:"ما التحية التي يقولها المسلم؟", a:"السلام عليكم"},
      {q:"ماذا نقول عندما نعجب بشيء؟", a:"ما شاء الله"},
      {q:"ماذا نقول عند طلب المغفرة من الله؟", a:"أستغفر الله"}
    ];
    const box = document.getElementById('quizBox');
    document.getElementById('quiz').onclick = ()=>{
      const item = questions[Math.floor(Math.random()*questions.length)];
      box.innerHTML = `\n        <div class="item">\n          <p style="margin-bottom:8px">${item.q}</p>\n          <input id="ans" type="text" placeholder="اكتب الإجابة" style="width:100%;height:40px;border:1px solid var(--gold);border-radius:10px;padding:0 10px"/>\n          <button id="check" class="btn-themed" style="margin-top:8px;width:100%;min-height:38px">تحقق</button>\n          <p id="res" style="margin-top:8px"></p>\n        </div>`;
      document.getElementById('check').onclick = ()=>{
        const val = (document.getElementById('ans').value||'').trim();
        const res = document.getElementById('res');
        if(val===item.a){
          res.textContent = 'أحسنت ✅';
          setTimeout(()=>document.getElementById('quiz').click(),700);
        } else {
          res.textContent = `الإجابة الصحيحة: ${item.a}`;
          setTimeout(()=>document.getElementById('quiz').click(),1400);
        }
      }
    };
  </script>
</body>
</html>
