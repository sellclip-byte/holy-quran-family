<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>الأطفال</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app reader">
    <header class="reader-head">
      <a class="back" href="index.html" aria-label="العودة">←</a>
      <div>
        <h1>قسم الأطفال</h1>
        <p>Quran for Kids</p>
      </div>
    </header>

    <section class="reader-card">
      <div style="display:grid;gap:10px">
        <a class="btn big quran" href="quran.html" style="text-decoration:none"><b>قراءة مبسطة</b><small>Simple Reading</small></a>
        <button id="quiz" class="btn big kids" type="button"><b>اختبار قصير</b><small>Short Quiz</small></button>
      </div>
      <div id="quizBox" style="margin-top:12px"></div>
      <p class="reader-note">محتوى تعليمي مبسط للأطفال</p>
    </section>
  </main>

  <script>
    const questions = [
      {q:'كم عدد سور القرآن الكريم؟', a:'114'},
      {q:'ما أول سورة في القرآن؟', a:'الفاتحة'},
      {q:'ما آخر سورة في القرآن؟', a:'الناس'}
    ];
    const box = document.getElementById('quizBox');
    document.getElementById('quiz').onclick = ()=>{
      const item = questions[Math.floor(Math.random()*questions.length)];
      box.innerHTML = `\n        <div style="padding:12px;border:1px solid rgba(212,175,55,.5);border-radius:12px;background:#102752">\n          <p style="margin-bottom:8px">${item.q}</p>\n          <input id="ans" type="text" placeholder="اكتب الإجابة" style="width:100%;height:40px;border:1px solid var(--gold);border-radius:10px;padding:0 10px"/>\n          <button id="check" style="margin-top:8px;width:100%;min-height:38px;border:1px solid var(--gold);border-radius:10px;background:#173565;color:#fff">تحقق</button>\n          <p id="res" style="margin-top:8px"></p>\n        </div>`;
      document.getElementById('check').onclick = ()=>{
        const val = (document.getElementById('ans').value||'').trim();
        document.getElementById('res').textContent = val===item.a ? 'أحسنت ✅' : `الإجابة الصحيحة: ${item.a}`;
      }
    };
  </script>
</body>
</html>
