<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>البحث</title>
  <link rel="stylesheet" href="styles.css" />
<style>
body{background:#2d180d!important}.app.reader{background:#071b33!important;border:3px solid #d8b55e!important;border-radius:22px!important;box-sizing:border-box!important;min-height:calc(100vh - 12px)!important;margin:6px auto!important;padding:14px!important;box-shadow:inset 0 0 0 2px #5c431f,0 0 18px #0007!important}
.search-shell{background:linear-gradient(180deg,#b99858,#806236);border:4px solid #e3c775;border-radius:24px;padding:14px;box-shadow:inset 0 0 0 2px #5c431f,0 8px 24px #0008}
.search-shell label{display:block;text-align:center;color:#2f1c08;font-size:1.25rem;font-weight:900;margin:4px 0 12px;line-height:1.7}
.search-shell #query{width:100%!important;box-sizing:border-box;min-height:54px!important;padding:0 14px!important;border:3px solid #d8b55e!important;border-radius:14px!important;background:#fffdf4!important;color:#2f1c08!important;font-size:1.2rem!important;font-weight:800!important}
.search-shell .reader-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.search-shell .reader-actions button{min-height:48px;border:2px solid #d8b55e;border-radius:13px;background:#45351d;color:#ffe7a3;font-size:1.12rem;font-weight:900}
.search-shell .reader-note{margin:14px 0 8px;text-align:center;color:#fff!important;font-size:1.12rem;font-weight:900;line-height:1.7}
#results .item{background:#fffdf4;border:2px solid #d8b55e;border-radius:14px;padding:12px;color:#2f1c08;font-size:1.05rem;line-height:1.7}
@media(max-width:600px){.search-shell{padding:10px}.search-shell label{font-size:1.15rem}.search-shell #query{font-size:1.1rem!important}}
</style></head>
<body>
  <main class="app reader">
    <header class="reader-head"><a class="back" href="index.html" aria-label="العودة">←</a><div><h1>البحث</h1><p>Search</p></div></header>
    <section class="reader-card search-shell">
      <form id="search-form">
        <label for="query">ابحث باسم سورة أو بكلمة من الآيات</label>
        <input id="query" type="search" autocomplete="off" style="width:100%;min-height:46px;padding:0 12px;border:1px solid var(--gold);border-radius:12px;background:#fffdf6;color:#16213b;font:inherit" />
        <div class="reader-actions">
          <button type="submit">بحث</button>
          <button type="button" id="clear">مسح</button>
        </div>
      </form>
      <p class="reader-note" id="status" aria-live="polite">ابحث باسم سورة أو بكلمة من الآيات.</p>
      <div id="results" style="display:grid;gap:8px"></div>
    </section>
  </main>
<script>
const names=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const form=document.getElementById("search-form"),input=document.getElementById("query"),status=document.getElementById("status"),results=document.getElementById("results"),chapterCache=new Map();
let searchId=0;
function normalize(text){return text.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")}
function loadChapter(n){if(!chapterCache.has(n)){chapterCache.set(n,fetch("https://quran-json.risanb.com/text/uthmani/chapters/"+n+".json").then(r=>{if(!r.ok)throw new Error("fetch failed");return r.json()}))}return chapterCache.get(n)}
function addResult(title,detail,chapter,ayah){const link=document.createElement("a");link.href=`quran.html?surah=${chapter}&ayah=${ayah}`;link.className="item item-link";const heading=document.createElement("strong");heading.textContent=title;link.appendChild(heading);if(detail){const excerpt=document.createElement("span");excerpt.textContent=detail;link.appendChild(excerpt)}results.appendChild(link)}
async function search(){const id=++searchId,query=normalize(input.value.trim());results.replaceChildren();if(Array.from(query).length<2){status.textContent="اكتب حرفين على الأقل.";return}status.textContent="جاري البحث…";try{const chapters=await Promise.allSettled(names.map((_,i)=>loadChapter(i+1)));if(id!==searchId)return;const available=chapters.filter(x=>x.status==="fulfilled").length;if(!available){status.textContent="تعذر تحميل بيانات القرآن. تحقق من الاتصال ثم حاول مرة أخرى.";return}let resultCount=0;for(let i=0;i<names.length&&resultCount<100;i++){if(normalize(names[i]).includes(query)){addResult("سورة "+names[i],"",i+1,1);resultCount++}}for(let i=0;i<chapters.length&&resultCount<100;i++){if(chapters[i].status!=="fulfilled")continue;const verses=chapters[i].value.verses||[];for(let j=0;j<verses.length&&resultCount<100;j++){const item=verses[j],text=item.text||"";if(normalize(text).includes(query)){const ayah=Number(item.id||item.aya)||j+1;addResult("سورة "+names[i]+" · آية "+ayah,text,i+1,ayah);resultCount++}}}status.textContent=resultCount?(resultCount===100?"عرض أول 100 نتيجة.":"تم العثور على "+resultCount+" نتيجة."):"لا توجد نتائج."}catch(e){if(id===searchId)status.textContent="تعذر البحث. تحقق من الاتصال ثم حاول مرة أخرى."}}
form.onsubmit=e=>{e.preventDefault();search()};document.getElementById("clear").onclick=()=>{searchId++;input.value="";results.replaceChildren();status.textContent="ابحث باسم سورة أو بكلمة من الآيات.";input.focus()};
</script>
</body>
</html>
