<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الأدعية</title>
<link rel="stylesheet" href="styles.css">
<style>
.dua-wrap{background:linear-gradient(180deg,#b99858,#806236);border:4px solid #e3c775;border-radius:24px;padding:14px;box-shadow:inset 0 0 0 2px #5c431f,0 8px 24px #0008}
.dua-intro{text-align:center;color:#2f1c08;font-size:1.25rem;font-weight:900;line-height:1.7;margin:4px 0 14px}
.dua-grid{display:grid;gap:12px}
.dua-card{background:#45351d;border:3px solid #d8b55e;border-radius:16px;padding:15px 14px;color:#fff0b9;box-shadow:0 4px 10px #0004}
.dua-card h2{margin:0 0 8px;color:#ffd66b;font-size:1.28rem;line-height:1.5}
.dua-card p{margin:0;color:#fff7d4;font-size:1.18rem;font-weight:700;line-height:1.95}
.cat{margin:16px 0 8px;padding:9px 12px;border-radius:13px;background:#fff0b9;color:#3b260d;text-align:center;font-size:1.2rem;font-weight:900}
.count{text-align:center;color:#3b260d;font-weight:900;margin:12px 0 2px}
@media(max-width:600px){.dua-wrap{padding:10px}.dua-card{padding:13px 12px}.dua-card h2{font-size:1.2rem}.dua-card p{font-size:1.12rem;line-height:1.9}.cat{font-size:1.12rem}}
</style>
</head>
<body>
<main class="app reader">
<header class="reader-head"><a class="back" href="index.html" aria-label="العودة">←</a><div><h1>الأدعية</h1><p>Dua</p></div></header>
<section class="reader-card dua-wrap">
<div class="dua-intro">أدعية وأذكار مختارة للاستخدام اليومي</div>
<div id="duas" class="dua-grid"></div>
<div class="count" id="count"></div>
</section>
</main>
<script>
const data=[
{c:'الاستيقاظ والنوم',t:'دعاء الاستيقاظ',a:'الحمد لله الذي أحيانا بعدما أماتنا وإليه النشور.'},
{c:'الاستيقاظ والنوم',t:'عند النوم',a:'باسمك اللهم أموت وأحيا.'},
{c:'الاستيقاظ والنوم',t:'دعاء النوم على الجنب',a:'اللهم أسلمت نفسي إليك، وفوضت أمري إليك، ووجهت وجهي إليك، وألجأت ظهري إليك، رغبة ورهبة إليك، لا ملجأ ولا منجا منك إلا إليك.'},
{c:'الاستيقاظ والنوم',t:'عند الفزع من النوم',a:'أعوذ بكلمات الله التامات من غضبه وعقابه وشر عباده ومن همزات الشياطين وأن يحضرون.'},

{c:'الصباح والمساء',t:'سيد الاستغفار',a:'اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي وأبوء بذنبي، فاغفر لي فإنه لا يغفر الذنوب إلا أنت.'},
{c:'الصباح والمساء',t:'ذكر الصباح والمساء',a:'رضيت بالله ربًا، وبالإسلام دينًا، وبمحمد ﷺ نبيًا.'},
{c:'الصباح والمساء',t:'الحفظ من الضر',a:'بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم.'},
{c:'الصباح والمساء',t:'التوكل على الله',a:'حسبي الله لا إله إلا هو عليه توكلت وهو رب العرش العظيم.'},
{c:'الصباح والمساء',t:'التسبيح',a:'سبحان الله وبحمده.'},
{c:'الصباح والمساء',t:'الاستعاذة',a:'أعوذ بكلمات الله التامات من شر ما خلق.'},

{c:'الطعام والشراب',t:'قبل الطعام',a:'بسم الله.'},
{c:'الطعام والشراب',t:'إن نسي التسمية في أوله',a:'بسم الله أوله وآخره.'},
{c:'الطعام والشراب',t:'بعد الطعام',a:'الحمد لله الذي أطعمني هذا ورزقنيه من غير حول مني ولا قوة.'},
{c:'الطعام والشراب',t:'دعاء الضيف لصاحب الطعام',a:'اللهم بارك لهم فيما رزقتهم، واغفر لهم وارحمهم.'},

{c:'المنزل والمسجد',t:'دخول المنزل',a:'بسم الله ولجنا، وبسم الله خرجنا، وعلى ربنا توكلنا.'},
{c:'المنزل والمسجد',t:'الخروج من المنزل',a:'بسم الله، توكلت على الله، ولا حول ولا قوة إلا بالله.'},
{c:'المنزل والمسجد',t:'دخول المسجد',a:'اللهم افتح لي أبواب رحمتك.'},
{c:'المنزل والمسجد',t:'الخروج من المسجد',a:'اللهم إني أسألك من فضلك.'},

{c:'السفر',t:'دعاء الركوب والسفر',a:'سبحان الذي سخر لنا هذا وما كنا له مقرنين وإنا إلى ربنا لمنقلبون.'},
{c:'السفر',t:'دعاء السفر',a:'اللهم إنا نسألك في سفرنا هذا البر والتقوى، ومن العمل ما ترضى، اللهم هون علينا سفرنا هذا واطو عنا بعده.'},
{c:'السفر',t:'دعاء الرجوع من السفر',a:'آيبون تائبون عابدون لربنا حامدون.'},

{c:'الوضوء والصلاة',t:'بعد الوضوء',a:'أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمدًا عبده ورسوله.'},
{c:'الوضوء والصلاة',t:'دعاء الاستفتاح',a:'سبحانك اللهم وبحمدك، وتبارك اسمك، وتعالى جدك، ولا إله غيرك.'},
{c:'الوضوء والصلاة',t:'بين السجدتين',a:'رب اغفر لي، رب اغفر لي.'},
{c:'الوضوء والصلاة',t:'بعد التشهد',a:'اللهم إني أعوذ بك من عذاب جهنم، ومن عذاب القبر، ومن فتنة المحيا والممات، ومن شر فتنة المسيح الدجال.'},
{c:'الوضوء والصلاة',t:'بعد الصلاة',a:'اللهم أنت السلام ومنك السلام، تباركت يا ذا الجلال والإكرام.'},

{c:'الاستغفار والتوبة',t:'الاستغفار',a:'أستغفر الله وأتوب إليه.'},
{c:'الاستغفار والتوبة',t:'دعاء التوبة',a:'رب اغفر لي وتب علي إنك أنت التواب الرحيم.'},
{c:'الاستغفار والتوبة',t:'دعاء المغفرة',a:'اللهم إنك عفو تحب العفو فاعف عني.'},

{c:'الهم والكرب',t:'دعاء الكرب',a:'لا إله إلا الله العظيم الحليم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم.'},
{c:'الهم والكرب',t:'دعاء الهم والحزن',a:'اللهم إني أعوذ بك من الهم والحزن، والعجز والكسل، والبخل والجبن، وضلع الدين وغلبة الرجال.'},
{c:'الهم والكرب',t:'دعاء يونس عليه السلام',a:'لا إله إلا أنت سبحانك إني كنت من الظالمين.'},
{c:'الهم والكرب',t:'عند الشدة',a:'حسبنا الله ونعم الوكيل.'},
{c:'الهم والكرب',t:'طلب تفريج الكرب',a:'يا حي يا قيوم برحمتك أستغيث، أصلح لي شأني كله ولا تكلني إلى نفسي طرفة عين.'},

{c:'المرض والشفاء',t:'دعاء الشفاء',a:'اللهم رب الناس، أذهب البأس، واشف أنت الشافي، لا شفاء إلا شفاؤك، شفاء لا يغادر سقمًا.'},
{c:'المرض والشفاء',t:'الرقية بالألم',a:'بسم الله، أعوذ بعزة الله وقدرته من شر ما أجد وأحاذر.'},
{c:'المرض والشفاء',t:'زيارة المريض',a:'لا بأس، طهور إن شاء الله.'},

{c:'الرزق والدين',t:'طلب الرزق الحلال',a:'اللهم اكفني بحلالك عن حرامك، وأغنني بفضلك عمن سواك.'},
{c:'الرزق والدين',t:'قضاء الدين',a:'اللهم إني أعوذ بك من المأثم والمغرم.'},
{c:'الرزق والدين',t:'طلب الخير',a:'رب إني لما أنزلت إلي من خير فقير.'},

{c:'الوالدان والأسرة',t:'للوالدين',a:'رب ارحمهما كما ربياني صغيرًا.'},
{c:'الوالدان والأسرة',t:'للزوج والذرية',a:'ربنا هب لنا من أزواجنا وذرياتنا قرة أعين واجعلنا للمتقين إمامًا.'},
{c:'الوالدان والأسرة',t:'طلب الذرية الصالحة',a:'رب هب لي من لدنك ذرية طيبة إنك سميع الدعاء.'},
{c:'الوالدان والأسرة',t:'للأبناء بالصلاح',a:'رب اجعلني مقيم الصلاة ومن ذريتي ربنا وتقبل دعاء.'},

{c:'الحفظ من الشر',t:'الحفظ من الشيطان',a:'أعوذ بالله من الشيطان الرجيم.'},
{c:'الحفظ من الشر',t:'التحصين',a:'قل أعوذ برب الفلق، وقل أعوذ برب الناس.'},
{c:'الحفظ من الشر',t:'الكفاية',a:'حسبي الله لا إله إلا هو عليه توكلت وهو رب العرش العظيم.'},

{c:'أدعية قرآنية',t:'دعاء الدنيا والآخرة',a:'ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار.'},
{c:'أدعية قرآنية',t:'طلب الهداية',a:'ربنا لا تزغ قلوبنا بعد إذ هديتنا وهب لنا من لدنك رحمة إنك أنت الوهاب.'},
{c:'أدعية قرآنية',t:'طلب العلم',a:'رب زدني علمًا.'},
{c:'أدعية قرآنية',t:'شرح الصدر',a:'رب اشرح لي صدري ويسر لي أمري واحلل عقدة من لساني يفقهوا قولي.'},
{c:'أدعية قرآنية',t:'طلب المغفرة والرحمة',a:'ربنا ظلمنا أنفسنا وإن لم تغفر لنا وترحمنا لنكونن من الخاسرين.'},
{c:'أدعية قرآنية',t:'دعاء الثبات',a:'ربنا أفرغ علينا صبرًا وثبت أقدامنا.'},
{c:'أدعية قرآنية',t:'دعاء المؤمنين',a:'ربنا اغفر لنا ولإخواننا الذين سبقونا بالإيمان ولا تجعل في قلوبنا غلًا للذين آمنوا ربنا إنك رؤوف رحيم.'},

{c:'أدعية جامعة',t:'خير الدنيا والآخرة',a:'اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي، وأصلح لي آخرتي التي إليها معادي.'},
{c:'أدعية جامعة',t:'طلب الهدى والتقى',a:'اللهم إني أسألك الهدى والتقى والعفاف والغنى.'},
{c:'أدعية جامعة',t:'طلب الخير كله',a:'اللهم إني أسألك من الخير كله عاجله وآجله، ما علمت منه وما لم أعلم.'},
{c:'أدعية جامعة',t:'الاستعاذة من الشر كله',a:'وأعوذ بك من الشر كله عاجله وآجله، ما علمت منه وما لم أعلم.'},
{c:'أدعية جامعة',t:'حسن الخاتمة والعمل',a:'اللهم أحسن عاقبتنا في الأمور كلها، وأجرنا من خزي الدنيا وعذاب الآخرة.'},
{c:'أدعية جامعة',t:'العفو والعافية',a:'اللهم إني أسألك العفو والعافية في الدنيا والآخرة.'}
];
const c=document.getElementById('duas');
let current='';
data.forEach(d=>{
 if(d.c!==current){current=d.c;const h=document.createElement('div');h.className='cat';h.textContent=current;c.appendChild(h);}
 const x=document.createElement('article');x.className='dua-card';
 x.innerHTML='<h2>'+d.t+'</h2><p>'+d.a+'</p>';c.appendChild(x);
});
document.getElementById('count').textContent='عدد الأدعية: '+data.length;
</script>
</body>
</html>
