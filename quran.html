<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>القرآن الكريم</title><meta name="theme-color" content="#2d180d"><link rel="stylesheet" href="styles.css"><style>
.quran-shell{background:linear-gradient(180deg,#b99858,#806236);border:4px solid #e3c775;border-radius:24px;padding:14px;box-shadow:inset 0 0 0 2px #5c431f,0 8px 24px #0008}
.quran-shell label{display:block;text-align:center;color:#2f1c08;font-size:1.2rem;font-weight:900;margin:2px 0 10px}
.quran-shell select{width:100%;min-height:52px;border:3px solid #d8b55e;border-radius:14px;background:#fff7df;color:#3b260d;padding:8px 12px;font-size:1.15rem;font-weight:800}
.ayah-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:12px 0}
.ayah-nav button,.reader-actions button{min-height:46px;border:2px solid #d8b55e;border-radius:13px;background:#45351d;color:#ffe7a3;font-size:1.05rem;font-weight:900}
#counter{color:#2f1c08;font-size:1.05rem;font-weight:900;text-align:center}
.ayah-box{margin:0;background:#fffdf4;border:3px solid #d8b55e;border-radius:18px;padding:20px 16px;min-height:150px;display:grid;place-items:center;box-shadow:0 4px 10px #0003}
#ayah{margin:0;text-align:center;color:#17120d;font-size:1.65rem;font-weight:700;line-height:2.15}
.reader-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.reader-note{margin:12px 0 0;text-align:center;color:#3b260d;font-size:.95rem;font-weight:800;line-height:1.6}
@media(max-width:600px){.quran-shell{padding:10px}.quran-shell select{font-size:1.08rem}.ayah-box{min-height:140px;padding:16px 12px}#ayah{font-size:1.48rem;line-height:2}.ayah-nav button,.reader-actions button{font-size:1rem}}
.charity-note{margin:26px auto 6px;padding:16px 14px;max-width:430px;border:2px solid #d8b55e;border-radius:16px;background:#45351d;color:#ffe7a3;text-align:center;font-weight:900;line-height:1.8}.charity-note .en{direction:ltr;display:block;margin-top:5px;color:#fff0b9;font-family:system-ui,Arial;font-size:.95rem}</style></head><body><main class="app reader"><header class="reader-head"><a href="index.html" class="back">←</a><div><h1>القرآن الكريم</h1><p>Holy Quran</p></div></header><section class="reader-card quran-shell"><label for="surah">اختر السورة · Select Surah</label><select id="surah"></select><div class="ayah-nav"><button id="prev">السابق</button><span id="counter"></span><button id="next">التالي</button></div><article class="ayah-box"><p id="ayah">جاري تحميل السورة…</p></article><div class="reader-actions"><button id="fav">☆ المفضلة</button><button id="resume">آخر موضع</button></div><p class="reader-note" id="status">النص العثماني. يتم حفظ آخر موضع تلقائيًا.</p></section><div class="charity-note">التطبيق صدقة لوجه الله، الرجاء مشاركته مع غيرك.<span class="en">This app is a charity for the sake of Allah. Please share it with others.</span></div></main><script>
const names=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const s=document.getElementById("surah"), ay=document.getElementById("ayah"), counter=document.getElementById("counter"), status=document.getElementById("status"); names.forEach((n,i)=>s.add(new Option((i+1)+" - "+n,i+1)));
let chapter=1,verse=1,verses=[];
async function loadChapter(n,keep=false){status.textContent="جاري تحميل السورة…";try{const r=await fetch("https://quran-json.risanb.com/text/uthmani/chapters/"+n+".json");if(!r.ok)throw 0;const d=await r.json();verses=d.verses||[];chapter=Number(n);if(!keep)verse=1;draw();status.textContent="النص العثماني • يتم حفظ آخر موضع تلقائيًا";}catch(e){ay.textContent="تعذر تحميل السورة. تحقق من الاتصال ثم حاول مرة أخرى.";status.textContent="سيتم دعم القراءة الكاملة دون إنترنت بعد حفظ ملفات القرآن محليًا.";}}
function draw(){const v=verses.find(x=>Number(x.id||x.aya)===verse)||verses[verse-1];if(!v)return;ay.textContent=v.text;counter.textContent="الآية "+verse+" من "+verses.length;s.value=chapter;localStorage.setItem("hqf-last",JSON.stringify({chapter,verse}));updateFav();}
s.onchange=()=>loadChapter(s.value);document.getElementById("prev").onclick=()=>{if(verse>1){verse--;draw()}};document.getElementById("next").onclick=()=>{if(verse<verses.length){verse++;draw()}};
function favs(){return JSON.parse(localStorage.getItem("hqf-favs")||"[]")}function updateFav(){document.getElementById("fav").textContent=favs().some(x=>x.chapter===chapter&&x.verse===verse)?"★ محفوظة":"☆ المفضلة"}
document.getElementById("fav").onclick=()=>{let f=favs(),i=f.findIndex(x=>x.chapter===chapter&&x.verse===verse);if(i>=0)f.splice(i,1);else f.push({chapter,verse});localStorage.setItem("hqf-favs",JSON.stringify(f));updateFav()};
document.getElementById("resume").onclick=async()=>{const l=JSON.parse(localStorage.getItem("hqf-last")||"null");if(l){verse=l.verse;await loadChapter(l.chapter,true)}};
const params=new URLSearchParams(location.search),chapterParam=params.get("surah")??params.get("chapter"),verseParam=params.get("ayah")??params.get("verse"),chapterNumber=Number(chapterParam),verseNumber=Number(verseParam),last=JSON.parse(localStorage.getItem("hqf-last")||"null");if(chapterParam!==null&&Number.isInteger(chapterNumber)&&chapterNumber>=1&&chapterNumber<=114){verse=Number.isInteger(verseNumber)&&verseNumber>=1?verseNumber:1;loadChapter(chapterNumber,true)}else if(last){verse=last.verse;loadChapter(last.chapter,true)}else loadChapter(1);
</script></body></html>
