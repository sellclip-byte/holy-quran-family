<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>الحفظ</title>
  <link rel="stylesheet" href="styles.css" />
<style>
.memo-shell{background:linear-gradient(180deg,#b99858,#806236);border:4px solid #e3c775;border-radius:24px;padding:18px 14px;box-shadow:inset 0 0 0 2px #5c431f,0 8px 24px #0008}
.memo-note{margin:0;background:#45351d;border:3px solid #d8b55e;border-radius:18px;padding:24px 16px;text-align:center;color:#fff;font-size:1.35rem;font-weight:900;line-height:1.9;box-shadow:0 4px 10px #0003}
.memo-note .en{display:block;direction:ltr;margin-top:7px;color:#fff0b9;font-family:system-ui,Arial;font-size:1rem;font-weight:800}
@media(max-width:600px){.memo-shell{padding:12px}.memo-note{font-size:1.25rem;padding:22px 12px}}
.memo-image{margin:18px auto 0;max-width:430px;border:3px solid #d8b55e;border-radius:18px;overflow:hidden;background:#45351d;box-shadow:0 6px 16px #0006}.memo-image img{display:block;width:100%;height:auto;object-fit:cover}</style></head>
<body>
  <main class="app reader">
    <header class="reader-head"><a class="back" href="index.html" aria-label="العودة">←</a><div><h1>الحفظ</h1><p>Memorization</p></div></header>
    <section class="reader-card memo-shell">
      <p class="memo-note">قريبًا: خطة الحفظ والمراجعة.<span class="en">Coming soon: Memorization &amp; Review Plan</span></p>
    </section><div class="memo-image"><img src="assets/memorization-dua.png" alt="Prayer at the Kaaba" loading="eager"></div>
  </main>
</body>
</html>
