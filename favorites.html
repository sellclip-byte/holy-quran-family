<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>المفضلة</title>
  <link rel="stylesheet" href="styles.css" />
<style>
.fav-shell{background:linear-gradient(180deg,#b99858,#806236);border:4px solid #e3c775;border-radius:24px;padding:14px;box-shadow:inset 0 0 0 2px #5c431f,0 8px 24px #0008}
#list{gap:10px!important}
#list .item{background:#45351d!important;border:2px solid #d8b55e!important;border-radius:14px!important;padding:14px 12px!important;color:#fff!important;text-decoration:none!important;font-size:1.15rem!important;line-height:1.6}
#list .item strong{color:#fff!important;font-size:1.18rem!important;font-weight:900}
#list .item span{color:#fff0b9!important;font-size:1.05rem!important;font-weight:800}
#clear{margin-top:12px!important;width:100%!important;min-height:48px!important;border:2px solid #d8b55e!important;border-radius:13px!important;background:#45351d!important;color:#ffe7a3!important;font-size:1.15rem!important;font-weight:900!important}
.fav-shell .reader-note{margin:14px 0 0;text-align:center;color:#fff!important;font-size:1.1rem!important;font-weight:900;line-height:1.7}
@media(max-width:600px){.fav-shell{padding:10px}#list .item{font-size:1.08rem!important}}
</style></head>
<body>
  <main class="app reader">
    <header class="reader-head"><a class="back" href="index.html" aria-label="العودة">←</a><div><h1>المفضلة</h1><p>Favorites</p></div></header>
    <section class="reader-card fav-shell">
      <div id="list" style="display:grid;gap:8px"></div>
      <button id="clear" class="btn-themed" style="margin-top:10px;width:100%;min-height:40px">مسح الكل</button>
      <p class="reader-note">تتم المزامنة مع مفضلة صفحة القرآن</p>
    </section>
  </main>
<script>
const names=["","الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const list=document.getElementById('list');
function get(){return JSON.parse(localStorage.getItem('hqf-favs')||'[]')}
function render(){const favs=get();list.innerHTML='';if(!favs.length){list.innerHTML='<p class="reader-note">لا توجد مفضلة بعد</p>';return;}favs.forEach((f,idx)=>{const a=document.createElement('a');a.href=`quran.html?chapter=${f.chapter}&verse=${f.verse}`;a.className='item item-link item-row';a.innerHTML=`<strong>${names[f.chapter]||('سورة '+f.chapter)}</strong><span>آية ${f.verse}</span>`;list.appendChild(a);});}
document.getElementById('clear').onclick=()=>{localStorage.removeItem('hqf-favs');render();};render();
</script>
</body>
</html>
