<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>المفضلة</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app reader">
    <header class="reader-head"><a class="back" href="index.html" aria-label="العودة">←</a><div><h1>المفضلة</h1><p>Favorites</p></div></header>
    <section class="reader-card">
      <div id="list" style="display:grid;gap:8px"></div>
      <button id="clear" style="margin-top:10px;width:100%;min-height:40px;border:1px solid var(--gold);border-radius:11px;background:#173565;color:#fff">مسح الكل</button>
      <p class="reader-note">تتم المزامنة مع مفضلة صفحة القرآن</p>
    </section>
  </main>
<script>
const names=["","الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const list=document.getElementById('list');
function get(){return JSON.parse(localStorage.getItem('hqf-favs')||'[]')}
function render(){const favs=get();list.innerHTML='';if(!favs.length){list.innerHTML='<p class="reader-note">لا توجد مفضلة بعد</p>';return;}favs.forEach((f,idx)=>{const a=document.createElement('a');a.href=`quran.html?chapter=${f.chapter}&verse=${f.verse}`;a.style.cssText='display:flex;justify-content:space-between;padding:10px 12px;border:1px solid rgba(212,175,55,.45);border-radius:12px;background:#102752;color:#fff;text-decoration:none';a.innerHTML=`<strong>${names[f.chapter]||('سورة '+f.chapter)}</strong><span>آية ${f.verse}</span>`;list.appendChild(a);});}
document.getElementById('clear').onclick=()=>{localStorage.removeItem('hqf-favs');render();};render();
</script>
</body>
</html>
